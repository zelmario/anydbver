---
# tasks file for mongodb
- name: Check that mongot can run next to this mongod
  when: mongot_version != ''
  block:
    - name: Fail when mongot has no package for this OS
      when: not mongot_info
      fail:
        msg: >-
          Percona Search for MongoDB {{ mongot_version }} has no {{ dist }} {{ ansible_architecture }}
          package. Percona builds it for el8 and el9 (x86_64 and aarch64): deploy with os:el9.
    - name: Fail when mongot has no mongod on the same node
      when: psmdb_version == '' and mongo_org_version == ''
      fail:
        msg: >-
          mongot runs next to mongod on the same node: add psmdb:8.3,replica-set=rs0
          to this node, for example 'anydbver deploy psmdb:8.3,replica-set=rs0 mongot'.
    - name: Fail when mongod is older than 8.3 or not in a replica set
      when: >-
        mongo_replicaset == '' or
        (psmdb_version != '' and psmdb_version is version('8.3', '<')) or
        (mongo_org_version != '' and mongo_org_version is version('8.2', '<'))
      fail:
        msg: >-
          mongot needs Percona Server for MongoDB 8.3 or later in a replica set
          (got psmdb {{ psmdb_version | default('-', true) }}, replica-set={{ mongo_replicaset | default('none', true) }}).
          Use psmdb:8.3,replica-set=rs0 on the same node.

- name: enable repo Percona Server for MongoDB
  when: psmdb_version != ''
  command:
    cmd: /usr/bin/percona-release enable "{{package_info['repo_enable_str']}}"
    creates: "/etc/yum.repos.d/percona-psmdb-{{pkg_major_no_dot}}-release.repo"

- name: Enable MongoDB Community repository
  when: mongo_org_version != ''
  copy:
    dest: "{{ package_info['repo_file'] }}"
    content: |
      [mongodb-org]
      name=MongoDB Repository
      baseurl={{ package_info['repo_url'] }}
      gpgcheck=0
      enabled=1

- name: Enable local repo.* caching
  include_tasks: common/tasks/repo_cache.yaml

- name: refresh percona repo
  when: >
    ( psmdb_version.startswith('3.0') or psmdb_version.startswith('3.6') or psmdb_version.startswith('4.0')
    or psmdb_version.startswith('4.2') or psmdb_version.startswith('4.4') )
    and (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and is_percona_repo_required != ''
  apt:
    update_cache: yes

- name: install Percona Server for MongoDB
  when: psmdb_version != '' and not ( psmdb_version.startswith('3.2') or psmdb_version.startswith('3.4') )
  package:
    name: "{{ package_info['packages'].split('|') }}"
    state: present

- name: install Percona Server for MongoDB 3.2 or 3.4
  when: psmdb_version.startswith('3.2') or psmdb_version.startswith('3.4')
  package:
    name: "{{ item }}"
    state: present
  with_items:
    - "https://repo.percona.com/percona/yum/release/7/RPMS/x86_64/{{ psmdb_name }}{{ psmdb_major_ver }}-tools-{{ psmdb_version }}.{{ dist }}.x86_64.rpm"
    - "https://repo.percona.com/percona/yum/release/7/RPMS/x86_64/{{ psmdb_name }}{{ psmdb_major_ver }}-shell-{{ psmdb_version }}.{{ dist }}.x86_64.rpm"
    - "https://repo.percona.com/percona/yum/release/7/RPMS/x86_64/{{ psmdb_name }}{{ psmdb_major_ver }}-server-{{ psmdb_version }}.{{ dist }}.x86_64.rpm"
    - "https://repo.percona.com/percona/yum/release/7/RPMS/x86_64/{{ psmdb_name }}{{ psmdb_major_ver }}-mongos-{{ psmdb_version }}.{{ dist }}.x86_64.rpm"
    - "https://repo.percona.com/percona/yum/release/7/RPMS/x86_64/{{ psmdb_name }}{{ psmdb_major_ver }}-{{ psmdb_version }}.{{ dist }}.x86_64.rpm"

- name: install MongoDB Community
  when: mongo_org_version != ''
  package:
    name: "{{ package_info['packages'].split('|') }}"
    state: present


- name: enable repo Percona Backup for MongoDB
  when: pbm_version != ""
  command:
    cmd: /usr/bin/percona-release enable pbm release
    creates: "/etc/yum.repos.d/percona-pbm-release.repo"

- name: install Percona Backup for MongoDB
  when: pbm_version != ""
  yum:
    name: "percona-backup-mongodb-{{percona_backup_mongodb_ver}}"
    state: present
    disable_gpg_check: yes

- name: enable repo Percona Search for MongoDB
  when: mongot_version != ''
  command:
    cmd: /usr/bin/percona-release enable ps4m release
    creates: /etc/yum.repos.d/percona-ps4m-release.repo

- name: install Percona Search for MongoDB
  when: mongot_version != ''
  package:
    name: "{{ mongot_package }}"
    state: present

- name: MongoDB Setup tasks
  when: install_only == ''
  include_tasks: setup.yaml


