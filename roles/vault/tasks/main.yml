---
# tasks file for vault
# HashiCorp Vault (community edition) as a key server, the way KB0057067 sets
# it up for pg_tde: plain HTTP on port 8200, file storage, kv-v2 at secret/.
# setup_vault_server.sh initializes and unseals it, and creates the token that
# pg-tde nodes use, so nothing has to be copied between containers.
- name: Install vault package deps
  package:
    name: "{{item}}"
    state: present
  # EL images ship curl-minimal, which conflicts with the curl package.
  with_items: "{{ ['unzip', 'curl'] if ansible_distribution in ['Debian', 'Ubuntu'] else ['unzip'] }}"

- name: Download and unpack vault binary
  ansible.builtin.unarchive:
    src: "https://releases.hashicorp.com/vault/{{vault_version}}/vault_{{vault_version}}_linux_{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.zip"
    dest: /usr/local/bin
    remote_src: yes
    creates: /usr/local/bin/vault

- name: Setup Vault
  when: install_only == ''
  command:
    cmd: /bin/bash /vagrant/tools/setup_vault_server.sh
    creates: /root/vault.configured
