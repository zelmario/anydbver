---
# tasks file for tools_and_monitoring
# PMM
- name: install podman (like docker)
  when: (pmm_server_version != "" and docker == "") or podman != ""
  package:
    name: podman
    state: present
- name: install Percona Toolkit
  when: percona_toolkit_version != ""
  package:
    name: "{{item}}"
    state: present
  with_items: "{{ os[dist]['percona_toolkit'].install_packages }}"

- name: install Perf
  when: perf != ""
  package:
    name: perf
    state: present

- name: install anydbver for docker/podman
  when: anydbver != ""
  block:
    - name: install git
      package:
        name: git
        state: present
    - name: Enable EPEL
      when: ansible_distribution == 'CentOS' or ansible_distribution == 'Rocky' or ansible_distribution == 'Red Hat Enterprise Linux' or ansible_distribution == 'OracleLinux'
      package:
        name: epel-release
        state: present
    - name: install jq
      package:
        name: jq
        state: present
    - name: fetch anydbver
      command:
        cmd: git clone -b docker-podman-k8s https://github.com/zelmario/anydbver.git /root/anydbver
        creates: /root/anydbver

- name: install and setup minio
  when: minio != ""
  block:
    - name: download minio
      shell:
        cmd: >-
          ARCH=$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/');
          curl -L -s https://github.com/pgsty/silo/releases/download/RELEASE.2026-08-04T00-00-00Z/minio_20260804000000.0.0_linux_${ARCH}.tar.gz | tar -xz -C /usr/local/bin minio;
          curl -L -s https://github.com/pgsty/mc/releases/download/RELEASE.2026-08-04T00-00-00Z/mcli_20260804000000.0.0_linux_${ARCH}.tar.gz | tar -xz -C /usr/local/bin mcli;
          mv /usr/local/bin/mcli /usr/local/bin/mc;
          printf '[Unit]\nDescription=MinIO\nAfter=network-online.target\n\n[Service]\nUser=minio\nGroup=minio\nEnvironmentFile=/etc/sysconfig/minio\nExecStart=/usr/local/bin/minio server $MINIO_OPTS $MINIO_VOLUMES\nRestart=always\nLimitNOFILE=65536\n\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/minio.service;
          useradd -m minio;
          echo -e "MINIO_VOLUMES=\"/home/minio\"\nMINIO_OPTS=\"--certs-dir /etc/minio/certs --address :9443\"\nMINIO_ROOT_USER=UkVQTEFDRS1XSVRILUFXUy1BQ0NFU1MtS0VZ\nMINIO_ROOT_PASSWORD=UkVQTEFDRS1XSVRILUFXUy1TRUNSRVQtS0VZ" > /etc/sysconfig/minio;
          chmod +x /usr/local/bin/minio /usr/local/bin/mc;
          bash /vagrant/tools/generate_ssl_certs.sh minio.percona.local client;
          mkdir -p /etc/minio/certs;
          cp /root/ssl/server-key.pem /etc/minio/certs/private.key;
          cp /root/ssl/server.pem /etc/minio/certs/public.crt;
          cp /root/ssl/ca.pem /etc/minio/certs/ca.pem;
          cp /etc/minio/certs/ca.pem /usr/share/pki/ca-trust-source/anchors/minio-ca.pem;
          chown -R minio /etc/minio/certs;
          update-ca-trust;
          systemctl daemon-reload;
          systemctl enable --now minio.service;
          echo 'export MC_HOST_localhost=https://UkVQTEFDRS1XSVRILUFXUy1BQ0NFU1MtS0VZ:UkVQTEFDRS1XSVRILUFXUy1TRUNSRVQtS0VZ@127.0.0.1:9443 MC_INSECURE=true' >> ~/.bashrc;
          export MC_HOST_localhost=https://UkVQTEFDRS1XSVRILUFXUy1BQ0NFU1MtS0VZ:UkVQTEFDRS1XSVRILUFXUy1TRUNSRVQtS0VZ@127.0.0.1:9443 MC_INSECURE=true;
          for i in $(seq 60); do /usr/local/bin/mc ls localhost >/dev/null 2>&1 && break; sleep 1; done;
          /usr/local/bin/mc mb --ignore-existing localhost/backup

- name: PMM Setup tasks
  when: install_only == ''
  include_tasks: setup.yaml
